<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Plan Semanal</title>
<meta name="description" content="Plan semanal de comida y ejercicio. Funciona sin internet.">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Plan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: bloques de color grandes. Selector de perfil = dos paneles a pantalla casi completa (toque = entra con una ola de color). Inicio = panel de saludo + dos mosaicos. Comida = panel de hoy con el anillo de los 5 tiempos, luego cada tiempo con 3 opciones que se rellenan de color al elegirlas. */
:root {
  color-scheme: light;
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #EEEFF6;
  --ink: #12142A;
  --muted: #5E6280;
  --line: #E0E2EE;
  --header-bg: rgba(255, 255, 255, .86);
  /* un color por perfil; --accent toma el del perfil activo */
  --prof-a: #2F54EB; --prof-a-ink: #FFFFFF; --prof-a-soft: #E4E9FF;
  --prof-m: #C026D3; --prof-m-ink: #FFFFFF; --prof-m-soft: #FAE3FC;
  --accent: var(--prof-a); --accent-ink: var(--prof-a-ink); --accent-soft: var(--prof-a-soft);
  --p: #0E9F9A; --c: #E59A00; --f: #EE5B3A;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
:root[data-profile="angel"] { --accent: var(--prof-a); --accent-ink: var(--prof-a-ink); --accent-soft: var(--prof-a-soft); }
:root[data-profile="macarena"] { --accent: var(--prof-m); --accent-ink: var(--prof-m-ink); --accent-soft: var(--prof-m-soft); }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 16px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.shell { max-width: 1040px; margin-inline: auto; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
svg { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
b, dd, .tnum { font-variant-numeric: tabular-nums; }
.link { color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 8px 2px; }

@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes letter { from { transform: translateY(108%); } to { transform: none; } }
@keyframes ping { from { transform: scale(1); opacity: .55; } to { transform: scale(3.2); opacity: 0; } }
@keyframes draw { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
@keyframes run { from { stroke-dashoffset: 30; } to { stroke-dashoffset: -100; } }

/* pastilla translúcida sobre color */
.pill { position: relative; isolation: isolate; overflow: hidden; display: inline-flex; align-items: center; gap: 8px; border-radius: 99px; padding: 9px 15px; font-weight: 700; font-size: .875rem; line-height: 1.2; transition: transform 160ms var(--ease-out); }
.pill::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: .16; z-index: -1; }
button.pill:active { transform: scale(.95); }
.pill svg { width: 1.1em; height: 1.1em; }

/* avatar */
.av { --s: 40px; width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-weight: 800; font-size: calc(var(--s) * .36); letter-spacing: -.02em; line-height: 1; }
.av.angel { background: var(--prof-a); color: var(--prof-a-ink); }
.av.macarena { background: var(--prof-m); color: var(--prof-m-ink); }

/* ola de color al entrar a un perfil */
.wipe { position: fixed; inset: 0; z-index: 100; }
.wipe.angel { background: var(--prof-a); }
.wipe.macarena { background: var(--prof-m); }

/* barra superior de páginas internas */
.top { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-bottom: 18px; padding: 6px; border-radius: 99px; background: var(--header-bg); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); border: 1px solid var(--line); }
.top > :first-child { justify-self: start; }
.top > :last-child { justify-self: end; }
.back { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); text-decoration: none; transition: transform 160ms var(--ease-out); }
.back:active { transform: scale(.92); }
.top .av { --s: 44px; }
.top-title { font-family: var(--font-display); font-weight: 700; font-size: .9375rem; letter-spacing: -.02em; }
@media (prefers-reduced-transparency: reduce) { .top { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; } }

/* selector de perfil */
.pick { min-height: calc(100svh - 96px); display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 18px; }
.pick-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 7vw, 2.8rem); letter-spacing: -.045em; line-height: 1.05; padding-top: 2vh; animation: rise 480ms var(--ease-out) backwards; }
.pick-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pcard { container-type: inline-size; position: relative; overflow: hidden; isolation: isolate; border-radius: 32px; min-height: 280px; padding: 24px; display: flex; flex-direction: column; justify-content: flex-end; background: var(--c0); color: var(--c0-ink); animation: rise 540ms var(--ease-out) backwards; transition: transform 200ms var(--ease-out); }
.pcard.angel { --c0: var(--prof-a); --c0-ink: var(--prof-a-ink); }
.pcard.macarena { --c0: var(--prof-m); --c0-ink: var(--prof-m-ink); animation-delay: 90ms; }
.pcard:active { transform: scale(.98); }
.pc-mono { position: absolute; right: -3%; top: -9%; z-index: -1; font-family: var(--font-display); font-weight: 800; font-size: clamp(11rem, 44vw, 20rem); line-height: 1; letter-spacing: -.08em; opacity: .15; pointer-events: none; transition: transform 600ms var(--ease-out); }
.pc-go { position: absolute; left: 24px; top: 24px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid currentColor; display: grid; place-items: center; }
.pc-name { max-width: 100%; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.5rem, 6.5vw, 2.6rem); font-size: clamp(1.4rem, 12.5cqw, 3.2rem); line-height: .98; letter-spacing: -.05em; }
.pc-name span { display: block; overflow-wrap: anywhere; }
@media (hover: hover) and (pointer: fine) {
  .pcard:hover { transform: translateY(-4px); }
  .pcard:hover:active { transform: scale(.98); }
  .pcard:hover .pc-mono { transform: translate(-3%, 3%) scale(1.07); }
}
@media (max-width: 640px) {
  .pick-grid { grid-template-columns: 1fr; grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .pcard { min-height: 200px; }
}

/* inicio */
.home-hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 36px; background: var(--accent); color: var(--accent-ink); padding: 20px 22px 26px; min-height: 320px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.hero-mono { position: absolute; right: -2%; bottom: -22%; z-index: -1; font-family: var(--font-display); font-weight: 800; font-size: clamp(15rem, 60vw, 26rem); line-height: 1; letter-spacing: -.08em; opacity: .14; pointer-events: none; }
.hero-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hello { display: grid; gap: 4px; }
.hello-small { font-size: 1.125rem; font-weight: 500; opacity: .9; }
.hello-name { display: block; overflow: hidden; padding-bottom: .1em; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.5rem, 11.5vw, 5.75rem); line-height: .98; letter-spacing: -.055em; }
.ch { display: inline-block; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.tile { position: relative; overflow: hidden; border-radius: 32px; min-height: 260px; padding: 22px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; text-decoration: none; transition: transform 200ms var(--ease-out); }
.tile:active { transform: scale(.97); }
@media (hover: hover) and (pointer: fine) { .tile:hover { transform: translateY(-5px); } .tile:hover:active { transform: scale(.97); } }
.tile.food { background: var(--surface); border: 1.5px solid var(--line); }
.tile.ex { background: var(--surface); border: 1.5px solid var(--line); }
.tile h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 6.5vw, 2.5rem); letter-spacing: -.05em; line-height: 1; }
.tile-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.go { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid currentColor; transition: transform 240ms var(--ease-out); }
.tile.food .go { color: var(--accent); }
.tile.ex .go { color: var(--f); }
@media (hover: hover) and (pointer: fine) { .tile:hover .go { transform: translateX(4px); } }
.mini { position: relative; width: 112px; aspect-ratio: 1; color: var(--accent); }
.mini .ringsvg { width: 100%; height: 100%; }
.mini-n { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; letter-spacing: -.04em; color: var(--ink); }
.ekg { width: 100%; max-width: 190px; height: 64px; color: var(--ink); overflow: visible; }
.ekg path { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.ekg .base { stroke: currentColor; opacity: .22; }
.ekg .run { stroke: var(--f); stroke-dasharray: 30 100; stroke-dashoffset: 30; animation: run 2.6s linear infinite; }
.fresh .home-hero { animation: rise 560ms var(--ease-out) backwards; }
.fresh .hello-small { animation: rise 480ms var(--ease-out) 120ms backwards; }
.fresh .ch { animation: letter 560ms var(--ease-out) backwards; animation-delay: calc(var(--i) * 45ms + 200ms); }
.fresh .tile { animation: rise 520ms var(--ease-out) backwards; }
.fresh .tile:nth-child(1) { animation-delay: 300ms; }
.fresh .tile:nth-child(2) { animation-delay: 380ms; }

/* panel de hoy (comida / ejercicio) */
.hero { position: relative; overflow: hidden; isolation: isolate; border-radius: 36px; background: var(--accent); color: var(--accent-ink); padding: 22px; display: grid; gap: 22px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 26px; align-items: center; }
.hero-date { display: grid; gap: 10px; justify-items: start; }
.dow { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.15rem, 5vw, 2.4rem); letter-spacing: -.05em; line-height: 1.05; }
.dnum { font-family: var(--font-display); font-weight: 800; font-size: clamp(6rem, 24vw, 10rem); line-height: .8; letter-spacing: -.09em; margin-left: -.04em; }
.mon { font-weight: 700; letter-spacing: .16em; text-transform: uppercase; font-size: .8125rem; opacity: .9; }
.hero-ring { display: grid; gap: 14px; justify-items: center; }
.ring { position: relative; width: min(100%, 250px); aspect-ratio: 1; }
.ringsvg { display: block; width: 100%; height: 100%; overflow: visible; }
.arc-t { fill: none; stroke: currentColor; opacity: .2; }
.arc { fill: none; stroke: currentColor; stroke-dasharray: var(--L) 700; stroke-dashoffset: var(--L); transition: stroke-dashoffset 560ms var(--ease-out); }
.arc.on { stroke-dashoffset: 0; }
.boot .arc { transition-delay: calc(var(--i) * 90ms + 150ms); }
.mini .arc-t { opacity: .16; }
.ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-n { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.9rem, 7.5vw, 2.5rem); letter-spacing: -.06em; line-height: 1; }
.ring-u { margin-top: 6px; font-size: .75rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .85; }
.snav { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.sn { position: relative; isolation: isolate; overflow: hidden; border-radius: 99px; padding: 7px 13px; font-size: .8125rem; font-weight: 700; transition: transform 160ms var(--ease-out), color 200ms ease; }
.sn::before { content: ""; position: absolute; inset: 0; z-index: -1; background: currentColor; opacity: .16; transition: background-color 200ms ease, opacity 200ms ease; }
.sn.on { color: var(--accent); }
.sn.on::before { background: var(--accent-ink); opacity: 1; }
.sn:active { transform: scale(.94); }
.hchips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hchip { position: relative; isolation: isolate; overflow: hidden; padding: 12px 14px; border-radius: 20px; display: grid; gap: 2px; }
.hchip::before { content: ""; position: absolute; inset: 0; z-index: -1; background: currentColor; opacity: .16; }
.hchip small { font-size: .75rem; font-weight: 500; opacity: .9; }
.hchip b { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: -.04em; }
.hrange { font-size: .875rem; opacity: .9; }
.hero.ex-hero { gap: 26px; min-height: 300px; align-content: space-between; }
.hero.ex-hero .dow { font-size: clamp(2.4rem, 11vw, 5rem); letter-spacing: -.06em; }
.hero .ekg { color: var(--accent-ink); max-width: 280px; height: 76px; }
.hero .ekg .run { stroke: currentColor; }
.hero .ekg .base { opacity: .28; }
.coming { margin-top: 14px; border: 2px dashed var(--line); border-radius: 28px; padding: 26px 22px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; letter-spacing: -.04em; color: var(--muted); }

/* tiempos de comida */
.slot { margin-top: 44px; scroll-margin-top: 84px; }
.slot-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 6px 16px; flex-wrap: wrap; }
.slot-head h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.45rem, 5.2vw, 2rem); letter-spacing: -.05em; line-height: 1.05; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.slot-head h2 small { font-family: var(--font-body); font-size: .875rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.now { position: relative; padding-left: 17px; font-family: var(--font-body); font-size: .6875rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.now::before, .now::after { content: ""; position: absolute; left: 0; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%; background: var(--accent); }
.now::after { animation: ping 1.9s var(--ease-out) infinite; }
.slot-meta { color: var(--muted); font-size: .875rem; font-weight: 500; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.opt { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px; border-radius: 30px; background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); min-width: 0; transition: border-color 160ms ease, color 220ms ease, transform 160ms var(--ease-out); }
.opt::before { content: ""; position: absolute; inset: -1px; z-index: -1; background: var(--accent); clip-path: circle(0% at var(--x, 50%) var(--y, 50%)); transition: clip-path 540ms var(--ease-out); }
.opt.on::before { clip-path: circle(150% at var(--x, 50%) var(--y, 50%)); }
.opt.on { color: var(--accent-ink); border-color: var(--accent); }
.opt:active { transform: scale(.975); }
@media (hover: hover) and (pointer: fine) { .opt:hover:not(.on) { border-color: var(--accent); } .opt:hover .opt-art { transform: scale(1.05); } .opt.on:hover .opt-art { transform: scale(1.08); } }
.opt-img { position: relative; display: block; aspect-ratio: 10 / 7; border-radius: 22px; overflow: hidden; background: var(--ba, #F1ECE0); }
.opt-art { display: block; width: 100%; height: 100%; transition: transform 640ms var(--ease-out); }
.opt.on .opt-art { transform: scale(1.08); }
.art { display: block; width: 100%; height: 100%; stroke: none; fill: currentColor; object-fit: cover; }
.tag { position: absolute; left: 10px; top: 10px; z-index: 1; font-size: .6875rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; line-height: 1.2; color: #12142A; background: rgba(255, 255, 255, .92); border-radius: 99px; padding: 5px 10px; }
.tick { position: absolute; right: 10px; top: 10px; z-index: 1; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center; opacity: 0; transform: scale(.5); transition: opacity 160ms ease, transform 280ms var(--ease-out); }
.opt.on .tick { opacity: 1; transform: none; }
.tick svg { width: 17px; height: 17px; stroke-width: 2.8; }
.opt-body { display: grid; gap: 6px; padding: 2px 10px 10px; }
.opt-name { font-weight: 700; font-size: 1.125rem; line-height: 1.2; letter-spacing: -.015em; text-wrap: balance; }
.opt-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: .875rem; transition: color 220ms ease; }
.opt-meta b { color: var(--ink); font-size: 1.0625rem; transition: color 220ms ease; }
.opt.on .opt-meta, .opt.on .opt-meta b { color: inherit; }
.opt-meta svg { width: 15px; height: 15px; }
.more { display: none; margin-left: auto; font-weight: 700; font-size: .8125rem; text-decoration: underline; text-underline-offset: 3px; }
.opt.on.closed .more { display: inline; }

/* detalle: se despliega bajo las opciones; es una transición, así que se puede interrumpir */
.detail-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms var(--ease-out); }
.detail-wrap.open { grid-template-rows: 1fr; }
.detail-clip { min-height: 0; overflow: hidden; visibility: hidden; transition: visibility 0s linear 320ms; }
.detail-wrap.open .detail-clip { visibility: visible; transition-delay: 0s; }
.detail-in { opacity: 0; transform: translateY(10px); transition: opacity 240ms var(--ease-out), transform 280ms var(--ease-out); }
.detail-wrap.open .detail-in { opacity: 1; transform: none; }
.detail { margin-top: 12px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 30px; padding: 24px; display: grid; gap: 24px; }
.d-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px 16px; flex-wrap: wrap; }
.d-head h3 { font-weight: 700; font-size: 1.1875rem; line-height: 1.25; max-width: 32ch; }
.d-actions { display: flex; gap: 16px; }
.d-kcal { display: flex; align-items: flex-end; gap: 10px; }
.d-kcal b { font-family: var(--font-display); font-weight: 800; font-size: clamp(3.4rem, 14vw, 5.2rem); line-height: .85; letter-spacing: -.08em; color: var(--accent); }
.d-kcal span { color: var(--muted); font-weight: 500; padding-bottom: 4px; }
.mbar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; animation: draw 560ms var(--ease-out) 160ms both; }
.mbar i { display: block; height: 100%; }
.mbar i + i { border-left: 3px solid var(--surface); }
.mbar .p, .sw.p { background: var(--p); } .mbar .c, .sw.c { background: var(--c); } .mbar .f, .sw.f { background: var(--f); }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.sw.x { background: var(--muted); opacity: .55; }
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.mt { background: var(--surface-2); border-radius: 20px; padding: 12px 14px; display: grid; gap: 4px; min-width: 0; }
.mt small { font-size: .8125rem; color: var(--muted); display: flex; align-items: center; gap: 7px; font-weight: 500; }
.mt b { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.05em; line-height: 1.1; }
.mt b i { font-style: normal; font-family: var(--font-body); font-weight: 500; font-size: .8125rem; letter-spacing: 0; color: var(--muted); margin-left: 2px; }
.d-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 36px; }
.d-cols h4 { font-size: .8125rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 700; margin-bottom: 14px; }
.d-cols ul, .d-cols ol { list-style: none; padding: 0; display: grid; gap: 12px; }
.d-cols ul li { display: grid; grid-template-columns: 10px 1fr; gap: 12px; align-items: start; }
.d-cols ul li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: .5em; }

/* movimiento reducido: se quedan los cambios de color y opacidad, se quita el desplazamiento */
@media (prefers-reduced-motion: reduce) {
  .pick-title, .pcard, .fresh .home-hero, .fresh .hello-small, .fresh .tile { animation-name: fade; }
  .fresh .ch { animation: none; }
  .now::after, .ekg .run { animation: none; }
  .ekg .run { stroke-dashoffset: 0; stroke-dasharray: none; opacity: .9; }
  .mbar { animation: none; }
  .detail-wrap, .detail-clip { transition: none; }
  .detail-in { transform: none; transition: opacity 160ms ease; }
  .tick { transform: none; }
  .opt::before { clip-path: none; opacity: 0; transition: opacity 200ms ease; }
  .opt.on::before { opacity: 1; }
  .arc { transition: opacity 160ms ease; stroke-dashoffset: 0; opacity: 0; }
  .arc.on { opacity: 1; }
  .pc-mono { transition: none; }
  .opt-art, .opt.on .opt-art { transform: none; transition: none; }
  .xt { animation-name: fade; }
  .fresh .rhero, .fresh .ex, .fresh .dc { animation-name: fade; }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function today() {
    var d = new Date();
    return {
      d: d,
      iso: d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()),
      dow: (d.getDay() + 6) % 7,
      mins: d.getHours() * 60 + d.getMinutes()
    };
  }
  var T = today();
  function todayLabel() { return DAYS[T.dow] + " " + T.d.getDate() + " de " + MONTHS[T.d.getMonth()]; }

  /* ---------- almacenamiento: una clave por perfil, nada se mezcla ---------- */
  var KEY = "mi-plan-semanal-v2";
  function readJSON(k) {
    try {
      var raw = localStorage.getItem(k);
      var o = raw ? JSON.parse(raw) : null;
      return o && typeof o === "object" ? o : null;
    } catch (e) { return null; }
  }
  function writeJSON(k, o) {
    try { localStorage.setItem(k, JSON.stringify(o)); } catch (e) {}
  }
  function profileById(id) {
    for (var i = 0; i < PROFILES.length; i++) if (PROFILES[i].id === id) return PROFILES[i];
    return null;
  }

  var S = { profile: null, picks: {}, ex: {}, xl: {}, wt: {}, steps: {}, closed: {}, switching: false };

  function loadPlan(id) {
    var o = readJSON(KEY + ":" + id) || {};
    return {
      picks: o.picks && typeof o.picks === "object" && (o.mver || 0) === ((PLANS[id] && PLANS[id].mver) || 0) ? o.picks : {},
      ex: o.ex && typeof o.ex === "object" ? o.ex : {},
      xl: o.xl && typeof o.xl === "object" ? o.xl : {},
      wt: o.wt && typeof o.wt === "object" ? o.wt : {},
      steps: o.steps && typeof o.steps === "object" ? o.steps : {}
    };
  }
  function savePlan() {
    var ks = Object.keys(S.picks).sort();
    while (ks.length > 14) delete S.picks[ks.shift()];
    var es = Object.keys(S.ex).sort();
    while (es.length > 70) delete S.ex[es.shift()];
    var xs = Object.keys(S.xl).sort();
    while (xs.length > 70) delete S.xl[xs.shift()];
    var ss = Object.keys(S.steps).sort();
    while (ss.length > 70) delete S.steps[ss.shift()];
    writeJSON(KEY + ":" + S.profile, { mver: PLANS[S.profile].mver || 0, picks: S.picks, ex: S.ex, xl: S.xl, wt: S.wt, steps: S.steps });
  }
  function setProfile(id) {
    var pl = loadPlan(id);
    S.profile = id;
    S.picks = pl.picks;
    S.ex = pl.ex;
    S.xl = pl.xl;
    S.wt = pl.wt;
    S.steps = pl.steps;
    S.closed = {};
    document.documentElement.setAttribute("data-profile", id);
    writeJSON(KEY, { last: id });
  }
  (function boot() {
    var m = readJSON(KEY);
    if (m && profileById(m.last)) setProfile(m.last);
  })();

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (ch) {

  // refleja lo registrado: lo de hoy, lo que ya se hizo antes en la semana y los días de la semana

    for (var t = 0; t < tiles.length; t++) {
      var el = tiles[t], id = el.getAttribute("data-id"), it = xItem(id);

        var total = rTotal(it), n = [], cmp = [], act = [];

        if (isToday) todayNames.push(it.name + (cmp[T.dow] ? " · completa" : noCardio ? " · falta cardio" : " " + n[T.dow] + "/" + total));
        if (isToday) text = ICON.check + (cmp[T.dow] ? "Hoy · completa" : noCardio ? "Hoy · falta cardio" : "Hoy · " + n[T.dow] + "/" + total + " series");

  /* ---------- resumen de hoy (inicio de Macarena): calorías, progreso y pasos ---------- */
  function cardioById(id) {
    var l = cardioList();
    for (var i = 0; i < l.length; i++) if (l[i].id === id) return l[i];
    return null;
  }
  // minutos sugeridos de un texto como "15–20 min (moderado)"
  function parseMin(s) {
    var m = /(\d+)(?:\s*[–-]\s*(\d+))?/.exec(s || "");
    if (!m) return 15;
    return m[2] ? (Number(m[1]) + Number(m[2])) / 2 : Number(m[1]);
  }
  // pasos escritos o pegados ("8,432", "8432", "pasos: 8.432"); null si no hay número
  function parseSteps(v) {
    var m = /\d[\d.,\s\u00a0]*/.exec(String(v == null ? "" : v));
    if (!m) return null;
    var s = m[0].replace(/[\s\u00a0]+$/g, "").replace(/[\s\u00a0]/g, "");
    if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, "");
    else s = s.replace(",", ".");
    var n = parseFloat(s);
    return isFinite(n) && n >= 0 && n < 200000 ? Math.round(n) : null;
  }
  // estimación de calorías quemadas por actividad (no incluye el metabolismo en reposo)
  function dashData() {
    var cfg = PLANS[S.profile].dash, kg = cfg.kg;
    var t = totals(), n = count();
    var steps = S.steps[T.iso] || 0;
    var series = 0, seriesTotal = 0, names = [], kcalCardio = 0, pending = false;
    body().forEach(function (b) {
      if (!b.ex) return;
      var c = rCount(T.iso, b.id);
      if (c > 0) { series += c; seriesTotal += rTotal(b); names.push(b.name); }
      if (c > 0 && c >= rTotal(b) && needsCardio(b) && cLog(b.id).length === 0) pending = true;
      var sel = cLog(b.id);
      if (sel.length) {
        var met = 0;
        sel.forEach(function (id) { var cc = cardioById(id); met += cc && cc.met ? cc.met : 5; });
        kcalCardio += (met / sel.length) * kg * parseMin(b.cardio) / 60;
      }
    });
    return {
      cons: n ? t.kcal : 0, n: n, total: slots().length,
      steps: steps, goal: cfg.stepGoal,
      kSteps: Math.round(steps * 0.0006 * kg),
      kRut: Math.round(series * 4 * kg * (2.5 / 60)),
      kCar: Math.round(kcalCardio),
      series: series, seriesTotal: seriesTotal, names: names, pending: pending
    };
  }

    if (d.n < d.total) cap = (plan.goal ? "Meta " : "Plan · ") + fmt(g[0]) + "–" + fmt(g[1]) + " kcal";
    else if (d.cons < g[0]) cap = fmt(g[0] - d.cons) + " bajo " + (plan.goal ? "la meta" : "el plan");
    else if (d.cons > g[1]) cap = fmt(d.cons - g[1]) + " sobre " + (plan.goal ? "la meta" : "el plan");
    else cap = "Dentro de" + (plan.goal ? " la meta" : "l plan");
    setTxt("d-cons-c", cap);
    setTxt("d-bs", fmt(d.kSteps));
    setTxt("d-br", fmt(d.kRut));
    setTxt("d-bc", fmt(d.kCar));
    setTxt("p-food-v", d.n + " de " + d.total + " tiempos");
    setBar("p-food-f", d.total ? d.n / d.total : 0);
    setTxt("p-rut-l", d.names.length ? d.names.join(" y ") : "Rutina");
    var rv = d.seriesTotal ? d.series + " de " + d.seriesTotal + " series" : "Sin iniciar";
    if (d.seriesTotal && d.series >= d.seriesTotal) rv += d.pending ? " · falta cardio" : " · completa";
    setTxt("p-rut-v", rv);
    setBar("p-rut-f", d.seriesTotal ? d.series / d.seriesTotal : 0);
  }
  function bootDash() {
    if (!document.getElementById("d-cons")) return;
    requestAnimationFrame(function () { requestAnimationFrame(paintDash); });
  }
  function toggleHealth() {
    var w = document.getElementById("hw"), b = document.getElementById("hbtn");
    if (!w) return;
    var open = !w.classList.contains("open");
    w.classList.toggle("open", open);
    if (b) b.setAttribute("aria-expanded", open ? "true" : "false");
  }
  /* ---------- movimiento ---------- */
  var RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  function reduce() { return RM.matches; }
  var EASE = "cubic-bezier(0.23, 1, 0.32, 1)";

  // al cambiar de pantalla: entra desde la derecha al avanzar y desde la izquierda al volver
  function enter(dir) {
    if (!app.animate) return;
    var dx = reduce() ? 0 : (dir >= 0 ? 18 : -18);
    app.animate(
      [{ opacity: 0, transform: "translateX(" + dx + "px)" }, { opacity: 1, transform: "translateX(0)" }],
      { duration: dx ? 260 : 180, easing: EASE }
    );
  }
  function swapIn(el) {
    if (!el.animate) return;
    el.animate(
      reduce() ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: "translateY(10px)" }, { opacity: 1, transform: "translateY(0)" }],
      { duration: 240, easing: EASE }
    );
  }
  // número que cuenta hasta su valor
  function countTo(el, to, dur) {
    if (!el) return;
    var from = el._v || 0;
    if (el._raf) cancelAnimationFrame(el._raf);
    if (reduce() || from === to) { el.textContent = fmt(to); el._v = to; return; }
    var t0 = null;
    function step(t) {
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      var v = Math.round(from + (to - from) * e);
      el.textContent = fmt(v);
      el._v = v;
      if (k < 1) el._raf = requestAnimationFrame(step);
    }
    el._raf = requestAnimationFrame(step);
  }
  // qué arcos del anillo están encendidos: lo elegido en comida, o los ejercicios hechos en una rutina
  function ringFlags(scope) {
    if (curR && scope.closest && scope.closest("#rhero")) {
      var l = rLog(T.iso, curR);
      return xItem(curR).ex.map(function (e) { return rSets(l, e) >= exSets(e); });
    }
    return slots().map(function (s) { return !!picked(s.k); });
  }
  function setArcs(scope) {
    var fl = ringFlags(scope);
    for (var i = 0; i < fl.length; i++) {
      var el = scope.querySelector('.arc[data-i="' + i + '"]');
      if (el) el.classList.toggle("on", fl[i]);
    }
  }
  function bootRings() {
    var rings = app.querySelectorAll("[data-ring]");
    if (!rings.length) return;
    var i;
    for (i = 0; i < rings.length; i++) rings[i].classList.add("boot");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        for (var j = 0; j < rings.length; j++) setArcs(rings[j]);
        countTo(document.getElementById("hk"), count() ? totals().kcal : 0, 700);
        if (curR) countTo(document.getElementById("rk"), rDoneEx(T.iso, curR), 600);
      });
    });
    setTimeout(function () {
      for (var j = 0; j < rings.length; j++) rings[j].classList.remove("boot");
    }, 1500);
  }

  /* ---------- render ---------- */
  var app = document.getElementById("app");
  var freshNext = false;
  var curR = null;

  function route() {
    var h = (location.hash || "").replace("#", "");
    if (h === "comida" || h === "ejercicio") return h;
    if (/^rutina-[a-z0-9]+$/.test(h)) return h;
    return "inicio";
  }
  function depth(r) { return r === "inicio" ? 0 : r.indexOf("rutina-") === 0 ? 2 : 1; }
  var cur = route();
  function screen() { return !S.profile || S.switching ? "pick" : route(); }

  function render(dir, fresh) {
    var f = fresh || freshNext;
    freshNext = false;
    var sc = screen();
    curR = null;
    if (sc.indexOf("rutina-") === 0) {
      var rit = xItem(sc.slice(7));
      if (rit && rit.ex) curR = rit.id; else sc = "ejercicio";
    }
    app.className = "shell" + (f ? " fresh" : "");
    if (curR) {
      var rr = xItem(curR);
      app.style.setProperty("--accent", rr.c);
      app.style.setProperty("--accent-ink", rr.ink);
      app.style.setProperty("--accent-soft", "color-mix(in srgb, " + rr.c + " 16%, var(--surface))");
    } else {
      app.style.removeProperty("--accent");
      app.style.removeProperty("--accent-ink");
      app.style.removeProperty("--accent-soft");
    }
    app.innerHTML = sc === "pick" ? pickView() : sc === "comida" ? foodView() : sc === "ejercicio" ? exerciseView() : curR ? rutinaView(curR) : homeView();
    if (sc === "comida") { updateNow(); bootRings(); }
    if (curR) paintRutinaStatus();
    if (sc === "inicio" || curR) bootRings();
    if (sc === "inicio") bootDash();
    if (sc === "ejercicio") bootExercise();
    if (dir !== undefined && !f) enter(dir);
  }

  // marca "Ahora" en el tiempo de comida que corresponde a la hora actual
  function updateNow() {
    var now = null;
    slots().forEach(function (s) { if (T.mins >= s.m) now = s.k; });
    slots().forEach(function (s) {
      var el = document.getElementById("now-" + s.k);
      if (el) el.hidden = s.k !== now;
    });
  }

  function checkDay() {
    var n = today();
    var changed = n.iso !== T.iso;
    T = n;
    if (changed) {
      S.closed = {};
      if (S.profile && !S.switching) render();
    } else {
      updateNow();
    }
  }
  setInterval(checkDay, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkDay(); });
  window.addEventListener("focus", checkDay);

  window.addEventListener("hashchange", function () {
    var next = route();
    var dir = depth(next) >= depth(cur) ? 1 : -1;
    cur = next;
    window.scrollTo(0, 0);
    render(dir);
  });

  /* ---------- resumen del día (se actualiza sin redibujar) ---------- */
  function updateSummary() {
    var t = totals(), n = count();
    function set(id, txt) { var el = document.getElementById(id); if (el) el.textContent = txt; }
    countTo(document.getElementById("hk"), n ? t.kcal : 0, 450);
    set("h-p", n ? t.p + " g" : "—");
    set("h-c", n ? t.c + " g" : "—");
    set("h-f", n ? t.f + " g" : "—");
    var hero = document.getElementById("hero");
    if (hero) setArcs(hero);
    slots().forEach(function (s) {
      var el = document.getElementById("sn-" + s.k);
      if (el) el.classList.toggle("on", !!picked(s.k));
    });
  }

  /* ---------- elegir platillo (solo se actualiza lo que cambia, para que las transiciones corran) ---------- */
  function focusPick(slot, i) {
    var el = app.querySelector('[data-fk="pick-' + slot + '-' + i + '"]');
    if (el) el.focus({ preventScroll: true });
  }

  function syncSlot(slot, changed) {
    var sec = app.querySelector('.slot[data-slot="' + slot + '"]');
    if (!sec) return;
    var sel = pickedIdx(slot);
    var closed = !!S.closed[slot];
    var btns = sec.querySelectorAll(".opt");
    for (var b = 0; b < btns.length; b++) {
      var on = sel === Number(btns[b].getAttribute("data-i"));
      btns[b].classList.toggle("on", on);
      btns[b].classList.toggle("closed", on && closed);
      btns[b].setAttribute("aria-pressed", on ? "true" : "false");
    }
    var wrap = sec.querySelector(".detail-wrap");
    var di = sec.querySelector(".detail-in");
    clearTimeout(wrap._t);
    if (sel != null) {
      var wasOpen = wrap.classList.contains("open");
      if (changed || !di.firstChild) {
        di.innerHTML = detail(slotObj(slot), meals()[slot][sel]);
        if (wasOpen) swapIn(di);
      }
      wrap.classList.toggle("open", !closed);
    } else {
      wrap.classList.remove("open");
      wrap._t = setTimeout(function () {
        if (!wrap.classList.contains("open")) di.innerHTML = "";
      }, 360);
    }
  }

  function pick(slot, i) {
    var day = S.picks[T.iso] = S.picks[T.iso] || {};
    var changed = day[slot] !== i;
    if (changed) {
      day[slot] = i;
      delete S.closed[slot];
      savePlan();
    } else {
      S.closed[slot] = !S.closed[slot];
    }
    syncSlot(slot, changed);
    updateSummary();
  }
  function unpick(slot) {
    var prev = pickedIdx(slot);
    if (S.picks[T.iso]) delete S.picks[T.iso][slot];
    delete S.closed[slot];
    savePlan();
    syncSlot(slot, true);
    updateSummary();
    if (prev != null) focusPick(slot, prev);
  }
  function hide(slot) {
    var sel = pickedIdx(slot);
    S.closed[slot] = true;
    syncSlot(slot, false);
    if (sel != null) focusPick(slot, sel);
  }
  function goSlot(slot) {
    var sec = document.getElementById("slot-" + slot);
    if (sec) sec.scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: "start" });
  }

  /* ---------- entrar a un perfil: una ola de su color sale del toque y llena la pantalla ---------- */
  var wiping = false;
  function commitProfile(id) {
    S.switching = false;
    setProfile(id);
    window.scrollTo(0, 0);
    freshNext = true;
    if (route() !== "inicio") {
      cur = "inicio";
      location.hash = "#inicio";
    } else {
      render();
    }
  }
  // una ola de color sale del toque y llena la pantalla; al terminar se hace el cambio y la ola se desvanece
  function wipeTo(bg, x, y, commit) {
    if (wiping) return;
    wiping = true;
    if (reduce() || !document.body.animate) {
      commit();
      wiping = false;
      return;
    }
    var W = window.innerWidth, H = window.innerHeight;
    var rad = Math.ceil(Math.sqrt(Math.pow(Math.max(x, W - x), 2) + Math.pow(Math.max(y, H - y), 2))) + 12;
    var w = document.createElement("div");
    w.className = "wipe";
    w.style.background = bg;
    w.style.clipPath = "circle(0px at " + x + "px " + y + "px)";
    document.body.appendChild(w);
    var a = w.animate(
      [{ clipPath: "circle(0px at " + x + "px " + y + "px)" }, { clipPath: "circle(" + rad + "px at " + x + "px " + y + "px)" }],
      { duration: 560, easing: EASE, fill: "forwards" }
    );
    a.onfinish = function () {
      commit();
      var b = w.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 380, easing: "ease-out", fill: "forwards" });
      b.onfinish = function () { w.remove(); wiping = false; };
    };
  }
  function enterProfile(id, x, y) {
    if (!profileById(id)) return;
    wipeTo(id === "angel" ? "var(--prof-a)" : "var(--prof-m)", x, y, function () { commitProfile(id); });
  }

  /* ---------- eventos ---------- */
  // el relleno de color de una opción nace en el punto donde la tocas
  app.addEventListener("pointerdown", function (e) {
    var o = e.target.closest(".opt, .ex, .cc");
    if (!o) return;
    var r = o.getBoundingClientRect();
    o.style.setProperty("--x", (e.clientX - r.left) + "px");
    o.style.setProperty("--y", (e.clientY - r.top) + "px");
  });

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t) return;
    var act = t.getAttribute("data-act");
    var slot = t.getAttribute("data-slot");
    if (act === "pick") {
      if (e.detail === 0) { t.style.setProperty("--x", "50%"); t.style.setProperty("--y", "50%"); }
      pick(slot, Number(t.getAttribute("data-i")));
    }
    else if (act === "unpick") unpick(slot);
    else if (act === "hide") hide(slot);
    else if (act === "goslot") goSlot(slot);
    else if (act === "xpick") xpick(t.getAttribute("data-id"));
    else if (act === "xopen") {
      var px = e.clientX, py = e.clientY;
      if (e.detail === 0 || (!px && !py)) {
        var rc = t.getBoundingClientRect();
        px = rc.left + rc.width / 2; py = rc.top + rc.height / 2;
      }
      openRoutine(t.getAttribute("data-id"), px, py);
    }
    else if (act === "rset") rset(t.getAttribute("data-k"), Number(t.getAttribute("data-n")), t.closest(".ex"));
    else if (act === "rstep") rstep(t.getAttribute("data-k"), Number(t.getAttribute("data-d")), t.closest(".ex"));
    else if (act === "rcardio") rcardio(t.getAttribute("data-c"));
    else if (act === "health") toggleHealth();
    else if (act === "enter") {
      var x = e.clientX, y = e.clientY;
      if (e.detail === 0 || (!x && !y)) {
        var r = t.getBoundingClientRect();
        x = r.left + r.width / 2; y = r.top + r.height / 2;
      }
      enterProfile(t.getAttribute("data-id"), x, y);
    }
    else if (act === "switch") { S.switching = true; window.scrollTo(0, 0); render(-1); }
  });

  // el peso de cada ejercicio se guarda al escribirlo
  app.addEventListener("input", function (e) {
    if (e.target.classList && e.target.classList.contains("wi")) onWeight(e.target, false);
    if (e.target.id === "stepsInput") {
      var n = parseSteps(e.target.value);
      if (n === null && e.target.value.trim() !== "") return;
      if (n === null) delete S.steps[T.iso]; else S.steps[T.iso] = n;
      savePlan();
      paintDash();
    }
  });
  app.addEventListener("change", function (e) {
    if (e.target.classList && e.target.classList.contains("wi")) onWeight(e.target, true);
    if (e.target.id === "stepsInput") e.target.value = S.steps[T.iso] || "";
  });
  // al pegar desde un atajo ("pasos: 8,432") se queda solo el número
  app.addEventListener("paste", function (e) {
    if (e.target.id !== "stepsInput") return;
    var txt = (e.clipboardData && e.clipboardData.getData("text")) || "";
    var n = parseSteps(txt);
    if (n === null) return;
    e.preventDefault();
    e.target.value = n;
    S.steps[T.iso] = n;
    savePlan();
    paintDash();
  });

  render(undefined, screen() === "inicio");
})();
</script>

<script>
// modo sin conexión: la primera vez, abre la app con internet para que se guarde todo
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
